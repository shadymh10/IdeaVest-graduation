name: "CI/CD - Build, Push & Deploy"

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "README.md"
  pull_request:
    branches: [main]

env:
  DOCKERHUB_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/ideavest-frontend
  DOCKERHUB_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/ideavest-backend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # Stage 1: Test
  # ============================================
  test:
    name: "🧪 Run Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Check
        run: npm run build

  # ============================================
  # Stage 2: Build & Push Docker Images
  # ============================================
  build-push:
    name: "🐳 Build & Push Images"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: frontend
            dockerfile: docker/frontend/Dockerfile
            image_env: DOCKERHUB_FRONTEND
          - service: backend
            dockerfile: docker/backend/Dockerfile
            image_env: DOCKERHUB_BACKEND
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/coolad-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/coolad-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ============================================
  # Stage 3: Update K8s Manifests (GitOps)
  # ============================================
  update-manifests:
    name: "📦 Update K8s Manifests"
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in Kustomization
        run: |
          cd k8s/overlays/dev
          sed -i "s|name: DOCKERHUB_USERNAME/coolad-frontend|name: ${{ secrets.DOCKERHUB_USERNAME }}/coolad-frontend|" kustomization.yaml
          sed -i "s|name: DOCKERHUB_USERNAME/coolad-backend|name: ${{ secrets.DOCKERHUB_USERNAME }}/coolad-backend|" kustomization.yaml
          sed -i "/coolad-frontend/{n;s|newTag:.*|newTag: \"${{ env.IMAGE_TAG }}\"|}" kustomization.yaml
          sed -i "/coolad-backend/{n;s|newTag:.*|newTag: \"${{ env.IMAGE_TAG }}\"|}" kustomization.yaml

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "Update image tags to ${{ env.IMAGE_TAG }}"
          git push
