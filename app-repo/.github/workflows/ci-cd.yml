name: "CI/CD - Build, Push & Deploy"

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
      - "README.md"
  pull_request:
    branches: [main]

env:
  DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/coolad-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================
  # Stage 1: Test
  # ============================================
  test:
    name: "🧪 Run Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Check
        run: npm run build

  # ============================================
  # Stage 2: Build & Push Docker Image
  # ============================================
  build-push:
    name: "🐳 Build & Push Image"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Stage 3: Update K8s Manifests (GitOps)
  # ============================================
  update-manifests:
    name: "📦 Update K8s Manifests"
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in Kustomization
        run: |
          cd k8s/overlays/dev
          sed -i "s|newTag:.*|newTag: \"${{ env.IMAGE_TAG }}\"|" kustomization.yaml

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "Update image tag to ${{ env.IMAGE_TAG }}"
          git push
